name: genkit_llamadart
description: >-
  Genkit Dart plugin for local, on-device LLMs through llamadart: llama.cpp
  GGUF and LiteRT-LM chat, streaming, tool calling, JSON output, and embeddings.
version: 2.0.0
homepage: https://github.com/leehack/genkit-llamadart
repository: https://github.com/leehack/genkit-llamadart
issue_tracker: https://github.com/leehack/genkit-llamadart/issues
topics:
  - genkit
  - llm
  - gguf
  - llama-cpp
  - on-device-ai

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  genkit: ^1.0.0
  llamadart: ^0.11.1
  schemantic: ^1.0.0

dev_dependencies:
  crypto: ^3.0.7
  dartastic_opentelemetry: ^0.11.0
  genkit_otel: ^0.2.0
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.33.0
  yaml: ^3.1.4
