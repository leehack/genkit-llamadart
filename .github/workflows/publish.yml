name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify tag matches pubspec version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana

      - name: Cache real-model test artifacts
        uses: actions/cache@v4
        with:
          path: .dart_tool/llamadart_test_models
          key: ${{ runner.os }}-llamadart-test-models-${{ hashFiles('test/integration/genkit/test_support/real_model_test_support.dart') }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze

      - name: Verify pana score
        run: export PATH="$PATH:$HOME/.pub-cache/bin" && pana . --exit-code-threshold 0

      - name: Run tests
        run: dart test -x real-model

      - name: Run real-model tests
        env:
          LLAMADART_AUTO_DOWNLOAD_TEST_MODELS: '1'
        run: dart test test/integration/genkit/plugin/real_model_generate_returns_text_test.dart && dart test test/integration/genkit/actions/embedder_action/real_model_embed_returns_vector_test.dart

      - name: Verify publish readiness
        run: dart pub publish --dry-run

  publish:
    needs: verify
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  release:
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
