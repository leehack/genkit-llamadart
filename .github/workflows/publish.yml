name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify tag matches pubspec version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pubspec version $PUBSPEC_VERSION" >&2
            exit 1
          fi

          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Install pana
        run: flutter pub global activate pana

      - name: Cache real-model test artifacts
        uses: actions/cache@v5
        with:
          path: .dart_tool/llamadart_test_models
          key: ${{ runner.os }}-llamadart-test-models-${{ hashFiles('test/integration/genkit/test_support/real_model_test_support.dart') }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze

      - name: Verify pana score
        run: flutter pub global run pana . --exit-code-threshold 0

      - name: Run tests
        run: dart test -x real-model

      - name: Run real-model tests
        env:
          LLAMADART_AUTO_DOWNLOAD_TEST_MODELS: '1'
        run: dart test -t real-model

      - name: Verify publish readiness
        run: flutter pub publish --dry-run

  dependency-compatibility:
    name: Dependency compatibility (${{ matrix.resolution }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        resolution:
          - lower-bounds
          - latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve lower-bound runtime dependencies
        if: matrix.resolution == 'lower-bounds'
        run: dart pub add genkit@0.13.2 llamadart@0.8.0 schemantic@0.1.3

      - name: Resolve latest compatible dependencies
        if: matrix.resolution == 'latest'
        run: dart pub upgrade

      - name: Analyze package
        run: dart analyze

      - name: Run fast tests
        run: dart test -x real-model

  publish:
    needs:
      - verify
      - dependency-compatibility
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  release:
    needs:
      - verify
      - dependency-compatibility
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
