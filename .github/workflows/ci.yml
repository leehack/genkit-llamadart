name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install pana
        run: flutter pub global activate pana

      - name: Cache real-model test artifacts
        uses: actions/cache@v4
        with:
          path: .dart_tool/llamadart_test_models
          key: ${{ runner.os }}-llamadart-test-models-${{ hashFiles('test/integration/genkit/test_support/real_model_test_support.dart') }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze

      - name: Verify pana score
        run: flutter pub global run pana . --exit-code-threshold 0

      - name: Run tests
        run: dart test -x real-model

      - name: Run real-model tests
        env:
          LLAMADART_AUTO_DOWNLOAD_TEST_MODELS: '1'
        run: dart test test/integration/genkit/plugin/real_model_generate_returns_text_test.dart && dart test test/integration/genkit/actions/embedder_action/real_model_embed_returns_vector_test.dart

      - name: Verify publish readiness
        run: flutter pub publish --dry-run
