name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Only obsolete PR runs share a group; every main push keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B -m unittest discover -s .github -p "test_select_ci.py"
          python3 .github/select_ci.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve latest compatible dependencies
        run: flutter pub upgrade

      - name: Install pana
        run: flutter pub global activate pana

      - name: Cache real-model test artifacts
        if: steps.changes.outputs.runtime == 'true'
        uses: actions/cache@v5
        with:
          path: .dart_tool/llamadart_test_models
          key: ${{ runner.os }}-llamadart-test-models-${{ hashFiles('test/integration/genkit/test_support/real_model_test_support.dart') }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: dart analyze

      - name: Verify pana score
        run: flutter pub global run pana . --exit-code-threshold 0

      - name: Run tests
        if: steps.changes.outputs.runtime == 'true'
        run: dart test -x real-model

      - name: Run real-model tests
        if: steps.changes.outputs.runtime == 'true'
        env:
          LLAMADART_AUTO_DOWNLOAD_TEST_MODELS: '1'
        run: dart test -t real-model

      - name: Verify publish readiness
        run: flutter pub publish --dry-run

  dependency-compatibility:
    name: Dependency compatibility (lower bounds)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/select_ci.py

      - name: Set up Flutter
        if: steps.changes.outputs.runtime == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve lower-bound runtime dependencies
        if: steps.changes.outputs.runtime == 'true'
        run: dart pub add genkit@0.13.2 llamadart@0.8.0 schemantic@0.1.3

      - name: Analyze package
        if: steps.changes.outputs.runtime == 'true'
        run: dart analyze

      - name: Run fast tests
        if: steps.changes.outputs.runtime == 'true'
        run: dart test -x real-model
